# Linguistic-Agnostic SER - Master Configuration

models:
  whisper:
    path: "openai/whisper-medium"
    is_whisper: true

datasets:
  - MSP-Podcast

dataset_config:
  msp_podcast:
    num_classes: 4

training:
  batch_size: 4
  sample_rate: 16000
  random_state: 42
  cv_splits: 5
  classification:
    max_iter: 1000
  regression:
    alpha: 1.0
    task_types:
      - F0semitoneFrom27.5Hz_sma3nz_amean
      - loudness_sma3_amean
      - jitterLocal_sma3nz_amean

wandb:
  experiment_id: 8

noise_augmentation:
  enabled: true
  noise_dataset: "ESC-50"
  noise_dir: "ESC-50"
  snr_levels: [20, 10, 5, 0]
  seed: 42

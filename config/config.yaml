# Linguistic-Agnostic SER - Master Configuration

models:
  wav2vec2:
    path: "facebook/wav2vec2-large-960h"
    is_whisper: false
  hubert:
    path: "facebook/hubert-large-ll60k"
    is_whisper: false
  whisper:
    path: "openai/whisper-medium"
    is_whisper: true
  wavlm:
    path: "microsoft/wavlm-large"
    is_whisper: false
  mert:
    path: "m-a-p/MERT-v1-330M"
    is_whisper: false
  w2v_bert:
    path: "facebook/w2v-bert-2.0"
    is_whisper: false

datasets:
  - RAVDESS
  - EmoDB
  - IEMOCAP
  - SAVEE
  - AESDD
  - MESD

training:
  batch_size: 4
  sample_rate: 16000
  random_state: 42
  cv_splits: 5
  classification:
    max_iter: 1000
  regression:
    alpha: 1.0
    task_types:
      - F0semitoneFrom27.5Hz_sma3nz_amean
      - loudness_sma3_amean
      - jitterLocal_sma3nz_amean

wandb:
  experiment_id: 7

noise_augmentation:
  enabled: true
  noise_dataset: "ESC-50"
  noise_dir: "ESC-50"
  snr_levels: [20, 10, 5, 0]
  seed: 42
